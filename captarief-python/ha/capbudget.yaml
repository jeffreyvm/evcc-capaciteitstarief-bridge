# HA-kant van laag 0/1. Opnemen via:
#   homeassistant:
#     packages: !include_dir_named packages
# en dit bestand als packages/capbudget.yaml plaatsen.
#
# Dit package regelt NIETS. Het levert alleen de meetlaag en de ontsnappings-
# klep. Alle besluitvorming zit in capbudget (Python) en alle actuatie in evcc.

input_number:
  cap_vrijgave_w:
    name: Vrijgave piekvermogen
    icon: mdi:flash-alert
    min: 0
    max: 9200
    step: 100
    unit_of_measurement: W
    mode: slider
    # 0 = uit. Hoger dan de huidige maandpiek betekent: accepteer bewust een
    # duurdere piek. De daemon negeert waarden onder het lopende doel.

input_boolean:
  cap_regeling_actief:
    name: Capaciteitsregeling actief
    icon: mdi:tune-variant

template:
  - sensor:
      # Netafname als aparte grootheid: injectie mag het kwartierbudget niet
      # verlagen. Basis voor de Riemann-som hieronder.
      - name: Net afname W
        unique_id: cap_net_afname_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.p1_meter_power') | float(default=0) %}
          {{ [0, p] | max | round(1) }}
        availability: >
          {{ states('sensor.p1_meter_power') not in
             ['unknown', 'unavailable', 'none'] }}

  # Wat de daemon publiceert, terug zichtbaar in HA. Handig voor het dashboard
  # en om te zien of de keten leeft.
  - trigger:
      - platform: mqtt
        topic: capaciteit/status
    sensor:
      - name: Cap envelope
        unique_id: cap_envelope_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ trigger.payload_json.envelope_w }}"
        attributes:
          doel_w: "{{ trigger.payload_json.doel_w }}"
          reden: "{{ trigger.payload_json.reden }}"
          rest_wh: "{{ trigger.payload_json.get('rest_wh') }}"
          resterend_sec: "{{ trigger.payload_json.get('resterend_sec') }}"

sensor:
  - platform: integration
    source: sensor.net_afname_w
    name: Net afname energie
    unique_id: cap_net_afname_energie
    unit_prefix: k
    unit_time: h
    method: left
    max_sub_interval: "00:01:00"

utility_meter:
  net_afname_kwartier:
    name: Net afname kwartier
    source: sensor.net_afname_energie
    cycle: quarter-hourly

# Waakhond: staat de envelope-sensor langer dan 3 minuten stil, dan is de
# daemon of de MQTT-verbinding weg. evcc valt dan zelf terug op de statische
# maxPower — deze melding is er alleen om het te merken.
automation:
  - id: cap_waakhond_envelope
    alias: Capaciteit - waakhond envelope
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.cap_envelope
        to: ~
        for: "00:03:00"
      - platform: state
        entity_id: sensor.cap_envelope
        to: "unavailable"
        for: "00:03:00"
    action:
      - service: persistent_notification.create
        data:
          title: Capaciteitsregeling
          message: >
            Geen envelope-update meer ontvangen. evcc valt terug op de
            statische maxPower uit evcc.yaml.
