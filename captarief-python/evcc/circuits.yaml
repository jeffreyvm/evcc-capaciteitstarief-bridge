# Fragment voor evcc.yaml - laag 2.
#
# Het circuit is de begrenzer: evcc houdt de netaansluiting onder maxPower en
# regelt de laadpunten daarvoor terug. De statische waarde hieronder is de
# failsafe die geldt zodra de MQTT-waarde verloopt (timeout 120 s).
#
# Publiceer NOOIT retained op dit topic: dan blijft een oude envelope na een
# crash staan en werkt de terugval niet.

circuits:
  - name: main
    title: "hoofdcircuit"
    maxPower: 2500
    GetMaxPower:
      source: mqtt
      topic: capaciteit/circuit/maxpower
      timeout: 120s
    meter: grid

site:
  circuit: main

loadpoints:
  - title: oprit
    circuit: main
